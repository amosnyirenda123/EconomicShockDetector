services:
  db:
    image: mysql:8.0
    container_name: economic_shock_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-admin2255}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-economic_shock_db}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    container_name: economic_shock_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+mysqlconnector://root:${MYSQL_ROOT_PASSWORD:-admin2255}@db:3306/${MYSQL_DATABASE:-economic_shock_db}
      MODEL_PATH: models/final_model.joblib
      PREPROCESSOR_PATH: models/preprocessor.joblib
      APP_VERSION: "1.0.0"
    ports:
      - "8000:8000"
    volumes:
      # Mount model artefacts from host so you can swap models without rebuilding
      - ./modeling/models:/app/models:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    container_name: economic_shock_frontend
    restart: unless-stopped
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge
