    { name = "amosnyirenda123", email = "nyirendaamos1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "numpy>=2.5.4",
